navbar-border-col: "#1F2A22"
footer-col: "#0A0D0B"
footer-text-col: "#7F9687"
footer-link-col: "#7F9687"
footer-hover-col: "#4ADE80"

# Hide "Powered by Beautiful Jekyll"
remove-ads: true
footer-hide-themename: true

# Syntax highlighting (the stylesheet colors Rouge output)
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
